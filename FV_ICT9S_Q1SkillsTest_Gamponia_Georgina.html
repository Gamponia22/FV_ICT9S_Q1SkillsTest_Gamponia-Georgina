<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 SKILLS TEST</title>
    <style>
        body{
        background-image: url('https://durolabs.co/wp-content/uploads/2024/07/shutterstock_2330938337-scaled.jpg');
        background-size: cover;
        background-position: center;

        font-family: Georgia, 'Times New Roman', Times, serif;
        color: #123b63;

        width:500px;
        margin: 50px 0 0 80px;
    }
        h1{
        color: white;
        background-color: #1769aa;
        padding: 10px;
        text-align: center;
        border-radius: 10px;
    }
        h2{
        color: #1769aa
    }
        a{
        color: #1769aa;
    }
        input [type="text"],select,area{
        width: 100%;
        height: 25px;
        padding: 10px;
        border: 2px solid #9cccf0;
        border-radius: 8px;
    }
        input[type="text"]{
        width: 100%;
        height: 25px;
        padding: 4px;
        font-size: 14px;
        border: 2px solid #9cccf0;
    }
        textarea{
            height: 120px;
    }
        input[type="submit"]{
        width: 100%;
        height: 45px;
        background-color: #1769aa;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight:bold;
    }
        input[type="submit"]:hover{
        background-color: #0d4f82;
    }

    </style>
</head>

<div class="container">

<body>
    <h1>OBMC Robotics Club Application Form</h1>
<p>Welcome! Please out this form to apply for our school's robotics club</p>

<label for="">Full Name</label>
<br>
<input type="text"
id="Full Name" name="Full Name"
placeholder="Type Here...">
<br><br>

<label for="">Email</label>
<br>
<input type="text"
id="email" name="email"
placeholder="Type Here...">
<br><br>

<label>Grade Level</label>
<br>

<select name="grade level" id="grade level">
    <option value="grade 7">Grade 7</option>
    <option value="grade 8">Grade 8</option>
    <option value="grade 9">Grade 9</option>
    <option value="grade 10">Grade 10</option>
</select>
<br><br>

<label for="section">Section</label>
<br>

<input type="radio" id="section1" name="section">
<label for="section">Emerald</label>

<input type="radio" id="section2" name="section">
<label for="section">Ruby</label>

<input type="radio" id="section3" name="section">
<label for="section">Sapphire</label>

<input type="radio" id="section4" name="section">
<label for="section">Topaz</label>

<input type="radio" id="section5" name="section">
<label for="section">Jade</label>
<br><br>

<label for="interestsAndskills">Skills & Interests:</label>
<br>

<input type="checkbox" id="skill1" name="interestsAndskills">
<label for="interestsAndskills">Coding</label>

<input type="checkbox" id="skill2" name="interestsAndskills">
<label for="interestsAndskills">Designing</label>

<input type="checkbox" id="skill3" name="interestsAndskills">
<label for="interestsAndskills">Electronics</label>
<br><br>

<label for="experience">Do you have any prior experience with coding, designing, and/or electronics?</label>
<br>

<input type="radio" id="yes" name="experience">
<label for="yes">Yes</label>

<input type="radio" id="no" name="experience">
<label for="no">No</label>
<br><br>

<label for="knowledge">Tell us why you want to join and what you look forward to in this club:
</label>
<br><br>
<textarea id="knowledge" placeholder="Type here..." rows="6" cols="60"></textarea>
<br><br>
        
<input type="submit" id="submit" value="Submit">

<h2>Helpful Links:</h2>

<ol>
    <li><a href="https://library.wit.edu/guides/robotics/websites" target="_blank">Robotics Learning Resources Library</a></li>
    <li><a href="https://getintorobotics.com/" target="_blank">Robotics Resources</a></li>
</ol>

</div>
</body>
</html>
